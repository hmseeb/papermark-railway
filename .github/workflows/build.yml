name: Build and push image

on:
  push:
    branches: [main]
    paths: ["image/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # npm ci plus a full Next.js production build of a large app.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          push: true
          # Railway runs amd64.
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/papermark-railway:bb93cfd-r4
            ghcr.io/${{ github.repository_owner }}/papermark-railway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
